<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I-Rasa Perfumes - Admin Dashboard</title>

  <link rel="icon" href="img/Fevicon.png" type="image/png">
  <link rel="stylesheet" href="vendors/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="vendors/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="vendors/themify-icons/themify-icons.css">
  <link rel="stylesheet" href="css/style.css">

  <style>
    :root {
      --admin-bg: #0a0a0a;
      --admin-surface: #111111;
      --admin-surface-light: #1a1a1a;
      --admin-text: #e0e0e0;
      --admin-gold: #d4af37;
      --admin-gold-hover: #e5c158;
      --admin-border: #333333;
    }

    body {
      background-color: var(--admin-bg);
      color: var(--admin-text);
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--admin-bg); }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--admin-gold); }
    body.modal-open { padding-right: 0 !important; }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      color: var(--admin-gold);
      font-family: 'Cinzel', serif;
    }

    /* Sidebar */
    .admin-sidebar {
      width: 260px;
      background-color: var(--admin-surface);
      border-right: 1px solid var(--admin-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .admin-logo {
      text-align: center;
      border-bottom: 1px solid var(--admin-border);
    }

    .admin-logo img {
      max-width: 150px;
    }

    .admin-nav {
      flex-grow: 1;
      padding: 20px 0;
      overflow-y: auto;
    }

    .admin-nav-item {
      padding: 12px 24px;
      display: flex;
      align-items: center;
      color: var(--admin-text);
      text-decoration: none;
      transition: all 0.3s ease;
      cursor: pointer;
      border-left: 3px solid transparent;
    }

    .admin-nav-item:hover,
    .admin-nav-item.active {
      background-color: rgba(212, 175, 55, 0.1);
      color: var(--admin-gold);
      border-left-color: var(--admin-gold);
    }

    .admin-nav-item i {
      margin-right: 15px;
      font-size: 1.2rem;
      width: 24px;
      text-align: center;
    }

    /* Main Content */
    .admin-main {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .admin-header {
      height: 70px;
      background-color: var(--admin-surface);
      border-bottom: 1px solid var(--admin-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      flex-shrink: 0;
    }

    .admin-content {
      flex-grow: 1;
      padding: 30px;
      overflow-y: auto;
    }

    /* Cards & Tables */
    .admin-card {
      background-color: var(--admin-surface);
      border: 1px solid var(--admin-border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .admin-table {
      width: 100%;
      color: var(--admin-text);
      border-collapse: collapse;
    }

    .admin-table th {
      text-align: left;
      padding: 12px 15px;
      border-bottom: 2px solid var(--admin-border);
      color: var(--admin-gold);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .admin-table td {
      padding: 15px;
      border-bottom: 1px solid var(--admin-border);
      vertical-align: middle;
      font-size: 0.95rem;
    }

    .admin-table tbody tr:hover {
      background-color: rgba(255, 255, 255, 0.02);
    }

    /* Badges */
    .badge-status {
      padding: 5px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .badge-success {
      background: rgba(37, 211, 102, 0.1);
      color: #25d366;
      border: 1px solid #1a5c31;
    }

    .badge-warning {
      background: rgba(212, 175, 55, 0.1);
      color: #d4af37;
      border: 1px solid #735d1e;
    }

    .badge-danger {
      background: rgba(255, 77, 77, 0.1);
      color: #ff4d4d;
      border: 1px solid #8a2a2a;
    }

    .badge-info {
      background: rgba(59, 224, 224, 0.1);
      color: #3be0e0;
      border: 1px solid #1d6e6e;
    }

    /* Forms & Buttons */
    .admin-btn {
      background-color: var(--admin-gold);
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.3s;
      margin: 5px;
    }

    .admin-btn:hover {
      background-color: var(--admin-gold-hover);
    }

    .admin-btn-outline {
      background-color: transparent;
      color: var(--admin-gold);
      border: 1px solid var(--admin-gold);
    }

    .admin-btn-outline:hover {
      background-color: rgba(212, 175, 55, 0.1);
    }

    .admin-btn-sm {
      padding: 4px 10px;
      font-size: 0.8rem;
    }

    /* Tab Sections */
    .admin-section {
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .admin-section.active {
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Stats Cards */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: var(--admin-surface);
      border: 1px solid var(--admin-border);
      border-radius: 8px;
      padding: 20px;
      display: flex;
      align-items: center;
    }

    .stat-icon {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(212, 175, 55, 0.1);
      color: var(--admin-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-right: 15px;
    }

    .stat-details h3 {
      margin: 0 0 5px 0;
      font-size: 24px;
      color: #fff;
    }

    .stat-details p {
      margin: 0;
      color: #888;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
  </style>
</head>

<body>

  <!-- Sidebar -->
  <aside class="admin-sidebar">
    <div class="admin-logo">
      <a class="navbar-brand logo_h" href="index.html" style="display: flex; flex-direction: column; align-items: center; text-decoration: none; padding-top: 10px;">
        <span style="font-family: 'Samarkan', sans-serif !important; text-transform: lowercase; font-size: 32px; color: #d4af37; letter-spacing: 2px;">i
          rasa</span>
      </a>
    </div>

    <nav class="admin-nav">
      <a href="admin.html" class="admin-nav-item active"><i class="ti-dashboard"></i> Dashboard</a>
      <a href="admin-tickets.html" class="admin-nav-item"><i class="ti-headphone-alt"></i> Support Tickets</a>
      <a href="admin-enquiries.html" class="admin-nav-item"><i class="ti-email"></i> Enquiries</a>
      <a href="admin-orders.html" class="admin-nav-item"><i class="ti-shopping-cart-full"></i> Orders</a>
      <a href="admin-coupons.html" class="admin-nav-item"><i class="ti-gift"></i> Coupons & Offers</a>
      <a href="admin-payments.html" class="admin-nav-item"><i class="ti-credit-card"></i> Payments</a>
      <a href="admin-employees.html" class="admin-nav-item"><i class="ti-id-badge"></i> Employee Master</a>
      <a href="admin-subscribers.html" class="admin-nav-item"><i class="ti-bell"></i> Subscribers</a>
      <a href="admin-reports.html" class="admin-nav-item"><i class="ti-stats-up"></i> Reports</a>
    </nav>

    <div style="padding: 20px; border-top: 1px solid var(--admin-border);">
      <button class="admin-btn admin-btn-outline" style="width: 100%;" onclick="logoutAdmin()">
        <i class="ti-power-off"></i> Logout
      </button>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="admin-main">
    <header class="admin-header">
      <h4 id="pageTitle" style="margin: 0;">Dashboard Overview</h4>
      <div class="admin-user-info" style="display: flex; align-items: center; gap: 10px;">
        <div style="text-align: right;">
          <div style="font-size: 14px; font-weight: 600; color: #fff;" id="adminName">Loading...</div>
          <div style="font-size: 11px; color: var(--admin-gold);">Super Admin</div>
        </div>
        <div
          style="width: 40px; height: 40px; border-radius: 50%; background: #333; display: flex; align-items: center; justify-content: center;">
          <i class="ti-user" style="color: #fff;"></i>
        </div>
      </div>
    </header>

    <div class="admin-content">

      <!-- Dashboard Section -->
      <section id="dashboard" class="admin-section active">
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon"><i class="ti-money"></i></div>
            <div class="stat-details">
              <h3 id="statRevenue">₹0</h3>
              <p>Total Revenue</p>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon"><i class="ti-shopping-cart"></i></div>
            <div class="stat-details">
              <h3 id="statOrders">0</h3>
              <p>Total Orders</p>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon"><i class="ti-headphone"></i></div>
            <div class="stat-details">
              <h3 id="statTickets">0</h3>
              <p>Pending Tickets</p>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon"><i class="ti-user"></i></div>
            <div class="stat-details">
              <h3 id="statUsers">0</h3>
              <p>Registered Users</p>
            </div>
          </div>
        </div>

        <div class="admin-card">
          <h5 style="margin-bottom: 20px;">Revenue Overview</h5>
          <canvas id="revenueChart" height="80"></canvas>
        </div>
      </section>

      </section>

    </div>
  </main>

  <script src="vendors/jquery/jquery-3.2.1.min.js"></script>
  <script src="vendors/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="js/admin-alert.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    // Mock Chart Initialization
    const ctx = document.getElementById('revenueChart').getContext('2d');
    new Chart(ctx, {
      type: 'line',
      data: {
        labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
        datasets: [{
          label: 'Revenue (₹)',
          data: [12000, 19000, 15000, 25000, 22000, 30000],
          borderColor: '#d4af37',
          backgroundColor: 'rgba(212, 175, 55, 0.1)',
          borderWidth: 2,
          fill: true,
          tension: 0.4
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          y: { grid: { color: '#222' }, ticks: { color: '#888' } },
          x: { grid: { color: '#222' }, ticks: { color: '#888' } }
        }
      }
    });

    function logoutAdmin() {
      alert("Logging out...");
      window.location.href = "index.html";
    }

  </script>
</body>

</html>
